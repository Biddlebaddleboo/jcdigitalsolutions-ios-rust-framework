name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy --toolchain 1.94.1
      - name: Install iOS device and simulator targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain 1.94.1
      - name: Check iOS files device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-files --target aarch64-apple-ios
      - name: Check iOS files simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-files --target aarch64-apple-ios-sim
      - name: Clippy iOS files device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-files --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS files simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-files --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Check iOS preferences device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-preferences --target aarch64-apple-ios
      - name: Check iOS preferences simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-preferences --target aarch64-apple-ios-sim
      - name: Clippy iOS preferences device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-preferences --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS preferences simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-preferences --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Link and audit iOS app-data imports and deployment metadata
        if: runner.os == 'macOS'
        run: sh platform/ios/ios-files/check-app-data-link-imports.sh
      - name: Check iOS network device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-network --target aarch64-apple-ios
      - name: Check iOS network simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-network --target aarch64-apple-ios-sim
      - name: Clippy iOS network device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-network --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS network simulator target
        if: runner.os == 'macOS'
