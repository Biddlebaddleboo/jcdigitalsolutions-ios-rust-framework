name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy --toolchain 1.94.1
      - name: Install iOS device and simulator targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim --toolchain 1.94.1
      - name: Check iOS network device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-network --target aarch64-apple-ios
      - name: Check iOS network simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-network --target aarch64-apple-ios-sim
      - name: Clippy iOS network device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-network --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS network simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-network --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Check iOS notifications device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-notifications --target aarch64-apple-ios
      - name: Check iOS notifications simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-notifications --target aarch64-apple-ios-sim
      - name: Clippy iOS notifications device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-notifications --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS notifications simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-notifications --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Check iOS location device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-location --target aarch64-apple-ios
      - name: Check iOS location simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-location --target aarch64-apple-ios-sim
      - name: Clippy iOS location device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-location --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS location simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-location --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Check iOS sharing device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-sharing --target aarch64-apple-ios
      - name: Check iOS sharing simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-sharing --target aarch64-apple-ios-sim
      - name: Clippy iOS sharing device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-sharing --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS sharing simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-sharing --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Check iOS accessibility device target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-accessibility --target aarch64-apple-ios
      - name: Check iOS accessibility simulator target
        if: runner.os == 'macOS'
        run: cargo check --locked -p ios-accessibility --target aarch64-apple-ios-sim
      - name: Clippy iOS accessibility device target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-accessibility --all-targets --target aarch64-apple-ios -- -D warnings
      - name: Clippy iOS accessibility simulator target
        if: runner.os == 'macOS'
        run: cargo clippy --locked -p ios-accessibility --all-targets --target aarch64-apple-ios-sim -- -D warnings
      - name: Swift ABI scalar Rust caller probe
        if: runner.os == 'macOS'
        run: sh interop/swift-abi-core/tests/check-scalar-swiftcall.sh
      - name: Swift ABI retained class ownership Rust caller probe
        if: runner.os == 'macOS'
        run: sh interop/swift-abi-core/tests/check-retained-ownership.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace
      - name: C API header, layout, symbol, and consumer check
        if: runner.os == 'macOS'
        run: sh bindings/c/check.sh
      - name: Header-only C++17 binding check
        if: runner.os == 'macOS'
        run: sh bindings/cpp/check.sh
      - name: Optional secure-storage C ABI check
        if: runner.os == 'macOS'
        run: sh bindings/c/check-secure-storage.sh
      - name: Portable no_std checks
        run: cargo xtask no-std-check
      - name: Dependency inventory
        run: cargo xtask dependency-audit
      - name: ABI source inventory
        run: cargo xtask abi-audit --output target/xtask/abi-audit.json
      - name: Rust documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Documentation and zero-Swift-source checks
        run: cargo xtask docs-check
      - name: iOS simulator Release example build
        if: runner.os == 'macOS'
        run: cargo xtask ios-build --simulator --release
      - name: iOS simulator linkage and plist checks
        if: runner.os == 'macOS'
        run: |
          cargo xtask linkage-audit --binary target/ios-minimal/simulator/ios-minimal.app/ios-minimal --output target/xtask/ios-simulator-linkage.json
          plutil -lint target/ios-minimal/simulator/ios-minimal.app/Info.plist
      - name: Record Apple toolchain and SDK inventory
        if: runner.os == 'macOS'
        run: |
          cargo xtask toolchain-manifest --output target/xtask/toolchain-manifest.json
          cargo xtask sdk-inventory --sdk all --output target/xtask/sdk-inventory-all.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: target/xtask/
          if-no-files-found: ignore
