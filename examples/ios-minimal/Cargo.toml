[package]
name = "ios-minimal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Rust-owned UIKit application vertical slice"

[dependencies]
ios-runtime = { path = "../../platform/ios/ios-runtime" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIApplication", "UIButton", "UIControl", "UILabel", "UIScreen", "UIResponder", "UIView", "UIViewController", "UIWindow", "objc2-core-foundation"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes"] }

[[bin]]
name = "ios-minimal"
path = "src/main.rs"

[lints]
workspace = true
