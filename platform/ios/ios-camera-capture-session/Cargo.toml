[package]
name = "ios-camera-capture-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Default-camera capture session and preview layer for iOS"

[dependencies]
framework-media-authorization = { path = "../../../crates/framework-media-authorization", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
dispatch2 = { workspace = true, features = ["alloc"] }
ios-media-authorization = { path = "../ios-media-authorization", version = "0.1.0" }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSData", "NSError", "NSArray", "NSObject", "NSString", "NSURL"] }
objc2-av-foundation = { workspace = true, features = [
    "AVCaptureOutputBase",
    "AVCaptureFileOutput",
    "AVCapturePhotoOutput",
    "AVCaptureDevice",
    "objc2-core-foundation",
    "AVCaptureInput",
    "AVCaptureSession",
    "AVCaptureVideoDataOutput",
    "AVCaptureVideoPreviewLayer",
    "AVMediaFormat",
    "dispatch2",
    "objc2-core-media",
    "objc2-quartz-core",
] }
objc2-core-media = { workspace = true, features = ["CMSampleBuffer"] }

[lints]
workspace = true
