[package]
name = "ios-playback"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-file AVPlayer controls, asynchronous seeking, and HDR eligibility for iOS"

[dependencies]
framework-audio = { path = "../../../crates/framework-audio" }
framework-media = { path = "../../../crates/framework-media" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-av-foundation = { workspace = true, features = ["AVPlayer", "block2", "objc2-core-media"] }
objc2-core-media = { workspace = true, features = ["CMTime"] }
objc2-foundation = { workspace = true, features = ["NSString", "NSURL"] }

[lints]
workspace = true
