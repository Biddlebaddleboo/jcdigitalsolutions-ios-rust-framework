[package]
name = "ios-key-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "iOS Security backend for one P-256 public-key suitability query"

[dependencies]
framework-core.workspace = true
framework-key-support = { path = "../../../crates/framework-key-support", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["alloc", "CFData", "CFDictionary", "CFError", "CFNumber", "CFString"] }
objc2-security = { workspace = true, features = ["SecBase", "SecItem", "SecKey"] }

[lints]
workspace = true
