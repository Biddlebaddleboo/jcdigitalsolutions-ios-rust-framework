[package]
name = "ios-preferences"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "NSUserDefaults-backed iOS preference adapter"

[dependencies]
framework-core = { workspace = true }
framework-preferences = { path = "../../../crates/framework-preferences", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFNumber"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std", "NSData", "NSDate", "NSString", "NSUserDefaults", "NSValue"] }

[lints]
workspace = true
