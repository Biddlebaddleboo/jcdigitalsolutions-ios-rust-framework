[package]
name = "ios-background-tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "BGTaskScheduler app-refresh adapter for iOS"

[dependencies]
framework-background = { path = "../../../crates/framework-background", version = "0.1.0" }
framework-core.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-background-tasks = { workspace = true, features = [
    "BGTask",
    "BGTaskRequest",
    "BGTaskScheduler",
    "block2",
    "dispatch2",
] }
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }

[lints]
workspace = true
