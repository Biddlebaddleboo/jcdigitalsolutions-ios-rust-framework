[package]
name = "ios-accessibility"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded UIKit accessibility metadata setters for iOS"

[target.'cfg(target_os = "ios")'.dependencies]
ios-runtime = { path = "../ios-runtime" }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-ui-kit = { workspace = true, features = ["UIAccessibility", "UIAccessibilityConstants", "UIResponder", "UIView"] }

[lints]
workspace = true
