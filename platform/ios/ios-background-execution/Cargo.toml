[package]
name = "ios-background-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UIKit background-execution lease adapter for iOS applications"

[dependencies]
framework-background-execution = { path = "../../../crates/framework-background-execution", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
ios-runtime = { path = "../ios-runtime" }
objc2 = { workspace = true, features = ["std"] }
objc2-ui-kit = { workspace = true, features = ["UIApplication", "UIResponder", "block2"] }

[lints]
workspace = true
