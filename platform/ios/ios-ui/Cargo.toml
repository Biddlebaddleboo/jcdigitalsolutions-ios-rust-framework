[package]
name = "ios-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded native UIKit view and controls"

[features]
custom-render-metal = ["dep:objc2-metal", "dep:objc2-quartz-core", "objc2-ui-kit/objc2-quartz-core"]

[target.'cfg(target_os = "ios")'.dependencies]
framework-core.workspace = true
framework-ui = { path = "../../../crates/framework-ui" }
ios-runtime = { path = "../ios-runtime" }
ios-accessibility = { path = "../ios-accessibility" }
block2.workspace = true
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFData"] }
objc2-core-graphics = { workspace = true, features = ["CGBase", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { workspace = true, features = ["NSDecimalNumber", "NSError", "NSFormatter", "NSLocale", "NSRange", "NSEnumerator", "NSString", "NSNumberFormatter", "NSValue"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIApplication", "UIButton", "UIActivityIndicatorView", "UIAccessibility", "UIAccessibilityIdentification", "UIAccessibilityConstants", "UIAccessibilityContainer", "UIAccessibilityCustomAction", "UIAccessibilityElement", "UIContentSizeCategoryAdjusting", "UIControl", "UIEvent", "UITouch", "UIImage", "UIImageView", "UILabel", "UIFont", "UIFontDescriptor", "NSLayoutAnchor", "NSLayoutConstraint", "UILayoutGuide", "UIStackView", "UIScrollView", "UITableView", "UITableViewCell", "NSIndexPath_UIKitAdditions", "UISwitch", "UITextField", "UITextView", "UITextInput", "UIResponder", "UIViewController", "UIWindow", "UITextInputTraits", "UIColor", "UIView", "UIInteraction", "UIContextMenuInteraction", "UIContextMenuConfiguration", "UIAction", "UIMenu", "UIMenuElement", "UICollectionView", "UICollectionViewCell", "UICollectionViewCompositionalLayout", "UICollectionViewLayout", "UIDiffableDataSource", "UIGeometry", "objc2-core-foundation", "objc2-core-graphics", "block2"] }
objc2-metal = { workspace = true, optional = true, features = ["MTLAllocation", "MTLBlitCommandEncoder", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }
objc2-quartz-core = { workspace = true, optional = true, features = ["CALayer", "CAMetalLayer", "objc2-core-foundation", "objc2-metal"] }

[dev-dependencies]
framework-core.workspace = true
framework-ui = { path = "../../../crates/framework-ui" }

[lints]
workspace = true
