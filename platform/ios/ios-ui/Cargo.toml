[package]
name = "ios-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded native UIKit view and controls"

[target.'cfg(target_os = "ios")'.dependencies]
framework-core.workspace = true
framework-ui = { path = "../../../crates/framework-ui" }
ios-runtime = { path = "../ios-runtime" }
block2.workspace = true
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "CFData"] }
objc2-core-graphics = { workspace = true, features = ["CGBase", "CGColorSpace", "CGDataProvider", "CGImage"] }
objc2-foundation = { workspace = true, features = ["NSRange", "NSEnumerator", "NSString", "NSValue"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIApplication", "UIButton", "UIActivityIndicatorView", "UIAccessibility", "UIAccessibilityIdentification", "UIControl", "UIEvent", "UITouch", "UIImage", "UIImageView", "UILabel", "NSLayoutAnchor", "NSLayoutConstraint", "UILayoutGuide", "UIStackView", "UIScrollView", "UITableView", "UITableViewCell", "NSIndexPath_UIKitAdditions", "UISwitch", "UITextField", "UITextView", "UIResponder", "UIViewController", "UIWindow", "UITextInputTraits", "UIColor", "UIView", "UIInteraction", "UIContextMenuInteraction", "UIContextMenuConfiguration", "UIAction", "UIMenu", "UIMenuElement", "UICollectionView", "UICollectionViewCell", "UICollectionViewCompositionalLayout", "UICollectionViewLayout", "UIDiffableDataSource", "UIGeometry", "objc2-core-foundation", "objc2-core-graphics", "block2"] }

[dev-dependencies]
framework-core.workspace = true
framework-ui = { path = "../../../crates/framework-ui" }

[lints]
workspace = true
