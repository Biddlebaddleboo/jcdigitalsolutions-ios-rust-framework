[package]
name = "ios-navigation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native UIKit screen navigation for iOS"

[dependencies]
framework-core.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
framework-ui = { path = "../../../crates/framework-ui" }
ios-runtime = { path = "../ios-runtime" }
ios-ui = { path = "../ios-ui" }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSString"] }
objc2-ui-kit = { workspace = true, features = [
    "std",
    "UIAction",
    "UIBarButtonItem",
    "UIBarItem",
    "UIImage",
    "UINavigationController",
    "UINavigationItem",
    "UIResponder",
    "UIMenuElement",
    "UIView",
    "UIViewController",
    "UIWindow",
    "block2",
] }

[lints]
workspace = true
