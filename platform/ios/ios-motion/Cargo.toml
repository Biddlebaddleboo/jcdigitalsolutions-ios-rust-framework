[package]
name = "ios-motion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One-shot Core Motion accelerometer backend for iOS"

[dependencies]
framework-core.workspace = true
framework-motion = { path = "../../../crates/framework-motion" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-core-motion = { workspace = true, features = [
    "CMAccelerometer",
    "CMLogItem",
    "CMMotionManager",
    "block2",
] }
objc2-foundation = { workspace = true, features = ["NSError", "NSOperation"] }

[lints]
workspace = true
