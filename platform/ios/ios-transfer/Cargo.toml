[package]
name = "ios-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "iOS background HTTP download backend using Foundation URLSession"

[dependencies]
framework-core = { workspace = true }
framework-files = { path = "../../../crates/framework-files" }
framework-network = { path = "../../../crates/framework-network" }
framework-transfer = { path = "../../../crates/framework-transfer" }
ios-files = { path = "../ios-files" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
dispatch2 = { workspace = true, features = ["alloc", "objc2"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSDictionary",
    "NSError",
    "NSOperation",
    "NSURLError",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
    "NSString",
    "NSUUID",
    "NSValue",
    "block2",
] }

[lints]
workspace = true
