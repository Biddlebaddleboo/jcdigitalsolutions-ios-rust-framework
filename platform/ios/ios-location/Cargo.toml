[package]
name = "ios-location"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One-shot, foreground/background, and significant-change Core Location backend for iOS"

[dependencies]
framework-core.workspace = true
framework-location = { path = "../../../crates/framework-location" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
dispatch2 = { workspace = true, features = ["alloc", "objc2"] }
objc2 = { workspace = true, features = ["std"] }
objc2-core-location = { workspace = true, features = [
    "CLCircularGeographicCondition",
    "CLCondition",
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
    "CLMonitor",
    "CLMonitorConfiguration",
    "CLMonitoringEvent",
    "CLMonitoringRecord",
    "block2",
    "dispatch2",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSDate",
    "NSBundle",
    "NSObject",
    "NSString",
] }

[lints]
workspace = true
