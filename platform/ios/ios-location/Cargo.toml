[package]
name = "ios-location"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One-shot Core Location backend for iOS"

[dependencies]
framework-core.workspace = true
framework-location = { path = "../../../crates/framework-location" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = [
    "CLLocation",
    "CLLocationManager",
    "CLLocationManagerDelegate",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSDate", "NSObject"] }

[lints]
workspace = true
