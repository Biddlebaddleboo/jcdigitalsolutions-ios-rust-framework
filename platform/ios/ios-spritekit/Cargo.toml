[package]
name = "ios-spritekit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A bounded iOS SpriteKit node-position adapter"
build = "build.rs"

[target.'cfg(target_os = "ios")'.dependencies]
framework-core.workspace = true
framework-spritekit = { path = "../../../crates/framework-spritekit" }
ios-runtime = { path = "../ios-runtime" }
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "objc2"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIResponder"] }

[lints]
workspace = true
