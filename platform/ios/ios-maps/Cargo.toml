[package]
name = "ios-maps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded ARKit support query and MapKit geometry calls for iOS"

[dependencies]
framework-maps = { path = "../../../crates/framework-maps" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-ar-kit = { workspace = true, features = ["ARConfiguration", "objc2"] }
objc2-core-location = { workspace = true, features = ["CLLocation"] }
objc2-map-kit = { version = "=0.3.2", default-features = false, features = ["MKGeometry", "objc2-core-location"] }

[lints]
workspace = true
