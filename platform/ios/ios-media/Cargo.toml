[package]
name = "ios-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded iOS media-time, audio-status, and VideoToolbox capability adapters"

[features]
default = []
videotoolbox = ["dep:objc2-video-toolbox"]

[dependencies]
framework-media = { path = "../../../crates/framework-media", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-core-media = { workspace = true, features = ["CMTime"] }
objc2-avf-audio = { workspace = true, features = ["AVAudioSession"] }
objc2-video-toolbox = { workspace = true, features = ["VTDecompressionSession", "objc2-core-media"], optional = true }

[lints]
workspace = true
