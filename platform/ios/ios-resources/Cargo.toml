[package]
name = "ios-resources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Main application bundle resource backend for framework-resources"

[dependencies]
framework-core = { workspace = true }
framework-resources = { path = "../../../crates/framework-resources", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std", "FoundationErrors", "NSBundle", "NSData", "NSError", "NSString", "NSURL"] }

[lints]
workspace = true
