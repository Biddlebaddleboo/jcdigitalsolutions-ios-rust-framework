[package]
name = "ios-background-assets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only Background Assets queue and manifest snapshots for iOS"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-background-assets = { workspace = true, features = ["BAAssetPack", "BAAssetPackManifest", "BADownload", "BADownloadManager", "block2"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSError", "NSSet", "NSString"] }

[lints]
workspace = true
