[package]
name = "ios-sharing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Clipboard and outgoing share backends using public iOS UIKit APIs"

[dependencies]
framework-core.workspace = true
framework-sharing = { path = "../../../crates/framework-sharing", version = "0.1.0" }
ios-runtime = { path = "../ios-runtime" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "objc2"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString", "NSURL"] }
objc2-ui-kit = { workspace = true, features = [
    "UIActivity",
    "UIActivityViewController",
    "UIDevice",
    "UIPasteboard",
    "UIPopoverPresentationController",
    "UIPresentationController",
    "UIResponder",
    "UIView",
    "UIViewController",
    "UIWindow",
    "block2",
    "objc2-core-foundation",
] }

[lints]
workspace = true
