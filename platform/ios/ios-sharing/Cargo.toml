[package]
name = "ios-sharing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Clipboard and outgoing share backends using public iOS UIKit APIs"

[dependencies]
framework-core = { workspace = true, optional = true }
framework-sharing = { path = "../../../crates/framework-sharing", version = "0.1.0", optional = true }
ios-runtime = { path = "../ios-runtime", optional = true }

[features]
default = ["clipboard", "share"]
clipboard = [
    "dep:framework-core",
    "dep:framework-sharing",
    "dep:ios-runtime",
    "dep:objc2",
    "dep:objc2-foundation",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSData",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSString",
    "dep:objc2-ui-kit",
    "objc2-ui-kit/UIPasteboard",
    "objc2-ui-kit/UIImage",
]
share = [
    "dep:framework-core",
    "dep:framework-sharing",
    "dep:ios-runtime",
    "dep:dispatch2",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSError",
    "objc2-foundation/NSString",
    "objc2-foundation/NSURL",
    "dep:objc2-ui-kit",
    "objc2-ui-kit/UIActivity",
    "objc2-ui-kit/UIActivityViewController",
    "objc2-ui-kit/UIDevice",
    "objc2-ui-kit/UIPopoverPresentationController",
    "objc2-ui-kit/UIPresentationController",
    "objc2-ui-kit/UIResponder",
    "objc2-ui-kit/UIView",
    "objc2-ui-kit/UIViewController",
    "objc2-ui-kit/UIWindow",
    "objc2-ui-kit/block2",
    "objc2-ui-kit/objc2-core-foundation",
]
document-export = [
    "dep:ios-runtime",
    "dep:objc2",
    "dep:objc2-foundation",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSString",
    "objc2-foundation/NSURL",
    "dep:objc2-ui-kit",
    "objc2-ui-kit/UIDocumentPickerViewController",
    "objc2-ui-kit/UIResponder",
    "objc2-ui-kit/UIView",
    "objc2-ui-kit/UIViewController",
    "objc2-ui-kit/UIWindow",
    "objc2-ui-kit/block2",
]
document-import = [
    "dep:ios-runtime",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-foundation",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSProcessInfo",
    "objc2-foundation/NSString",
    "objc2-foundation/NSURL",
    "dep:objc2-ui-kit",
    "objc2-ui-kit/UIDocumentPickerViewController",
    "objc2-ui-kit/UIResponder",
    "objc2-ui-kit/UIView",
    "objc2-ui-kit/UIViewController",
    "objc2-ui-kit/UIWindow",
    "objc2-ui-kit/block2",
    "objc2-ui-kit/objc2-uniform-type-identifiers",
    "dep:objc2-uniform-type-identifiers",
]

[[example]]
name = "clipboard_link_check"
required-features = ["clipboard"]

[[example]]
name = "share_link_check"
required-features = ["share"]

[[example]]
name = "document_export_link_check"
required-features = ["document-export"]

[[example]]
name = "document_import_link_check"
required-features = ["document-import"]

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"], optional = true }
dispatch2 = { workspace = true, features = ["alloc", "objc2"], optional = true }
objc2 = { workspace = true, features = ["std"], optional = true }
objc2-core-foundation = { workspace = true, features = ["CFCGTypes", "objc2"], optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-ui-kit = { workspace = true, optional = true }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["UTType"], optional = true }

[lints]
workspace = true
