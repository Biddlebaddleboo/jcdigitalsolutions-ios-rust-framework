[package]
name = "ios-calendar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Calendar authorization and event-range backend using public EventKit APIs"

[dependencies]
framework-core.workspace = true
framework-calendar = { path = "../../../crates/framework-calendar" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-event-kit = { workspace = true, features = ["EKCalendar", "EKCalendarItem", "EKEvent", "EKEventStore", "EKObject", "EKTypes", "block2"] }
objc2-foundation = { workspace = true, features = ["NSError", "NSEnumerator"] }

[lints]
workspace = true
