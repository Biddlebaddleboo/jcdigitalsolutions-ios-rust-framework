[package]
name = "ios-call-observer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Biddlebaddleboo/jcdigitalsolutions-ios-rust-framework"
description = "One-shot active-call state snapshot for iOS CallKit"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-call-kit = { version = "=0.3.2", default-features = false, features = ["CXCallObserver", "CXCall"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "warn"
