[package]
name = "ios-network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Foreground HTTP backend using public Foundation URLSession APIs"

[dependencies]
framework-core.workspace = true
framework-network = { path = "../../../crates/framework-network" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = [
    "alloc",
    "block2",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSURLError",
    "NSString",
    "NSURL",
    "NSURLRequest",
    "NSURLResponse",
    "NSURLSession",
] }

[lints]
workspace = true
