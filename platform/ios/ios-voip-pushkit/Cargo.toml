[package]
name = "ios-voip-pushkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Opt-in iOS VoIP PushKit registration and delegate lifecycle"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
dispatch2 = { workspace = true, features = ["alloc", "objc2"] }
ios-call-provider = { path = "../callkit/ios-call-provider", default-features = false }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSData", "NSDictionary", "NSError", "NSObject", "NSJSONSerialization", "NSString", "NSSet"] }
objc2-push-kit = { version = "=0.3.2", default-features = false, features = ["alloc", "PKDefines", "PKPushCredentials", "PKPushPayload", "PKPushRegistry", "block2", "dispatch2"] }

[lints]
workspace = true
