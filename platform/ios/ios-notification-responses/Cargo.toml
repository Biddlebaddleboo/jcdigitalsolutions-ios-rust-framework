[package]
name = "ios-notification-responses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local notification response bridge for iOS"

[dependencies]
framework-notifications = { path = "../../../crates/framework-notifications" }

[target.'cfg(target_os = "ios")'.dependencies]
block2.workspace = true
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSObject", "NSString"] }
objc2-user-notifications = { workspace = true, features = [
    "block2",
    "UNNotification",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[lints]
workspace = true
