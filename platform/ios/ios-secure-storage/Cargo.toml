[package]
name = "ios-secure-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A narrow iOS Keychain backend for framework secure storage"

[dependencies]
framework-core.workspace = true
framework-secure-storage = { path = "../../../crates/framework-secure-storage", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["alloc", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-security = { version = "=0.3.2", default-features = false, features = ["SecBase", "SecItem"] }

[lints]
workspace = true
