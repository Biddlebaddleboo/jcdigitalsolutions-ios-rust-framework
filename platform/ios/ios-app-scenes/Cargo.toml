[package]
name = "ios-app-scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "UIKit scene activity snapshots and lifecycle events for iOS apps"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true }
ios-runtime = { path = "../ios-runtime" }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSArray", "NSEnumerator", "NSNotification", "NSOperation", "NSRange", "NSString", "block2"] }
objc2-ui-kit = { workspace = true, features = ["std", "UIApplication", "UIScene", "UISceneDefinitions", "UISceneSession", "UIResponder", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }

[dependencies]
framework-core = { workspace = true }

[lints]
workspace = true
