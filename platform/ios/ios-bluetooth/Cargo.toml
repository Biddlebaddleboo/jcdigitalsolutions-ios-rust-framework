[package]
name = "ios-bluetooth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bluetooth discovery, connections, and GATT values for iOS"

[dependencies]
framework-bluetooth = { path = "../../../crates/framework-bluetooth" }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-core-bluetooth = { workspace = true, features = [
    "CBManager",
    "CBCentralManager",
    "CBPeer",
    "CBPeripheral",
    "CBAttribute",
    "CBCharacteristic",
    "CBService",
    "CBUUID",
    "CBAdvertisementData",
    "CBPeripheralManager",
    "CBPeripheralManagerConstants",
    "dispatch2",
] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSData", "NSString", "NSObject", "NSUUID", "NSValue"] }

[lints]
workspace = true
