[package]
name = "ios-health-authorization"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Public iOS HealthKit availability and authorization requests"

[dependencies]
framework-core.workspace = true
framework-health-authorization = { path = "../../../crates/framework-health-authorization" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = [
    "alloc",
    "NSError",
    "NSObject",
    "NSSet",
    "NSString",
] }
objc2-health-kit = { workspace = true, features = [
    "HKHealthStore",
    "HKObjectType",
    "HKTypeIdentifiers",
    "block2",
] }

[lints]
workspace = true
