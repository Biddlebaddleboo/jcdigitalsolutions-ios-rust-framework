[package]
name = "ios-accessory-setup-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Previously selected AccessorySetupKit accessory count for iOS"

[target.'cfg(all(target_os = "ios", not(target_abi = "macabi")))'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
dispatch2 = { workspace = true, features = ["alloc", "objc2"] }
objc2 = { workspace = true, features = ["std"] }
objc2-accessory-setup-kit = { version = "=0.3.2", default-features = false, features = [
    "ASAccessory",
    "ASAccessoryEvent",
    "ASAccessorySession",
    "block2",
    "dispatch2",
] }
objc2-foundation = { workspace = true, features = ["NSArray"] }

[lints]
workspace = true
