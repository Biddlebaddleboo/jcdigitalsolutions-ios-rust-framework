[package]
name = "ios-notifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Local notification backend using public iOS UserNotifications APIs"

[dependencies]
framework-core.workspace = true
framework-notifications = { path = "../../../crates/framework-notifications" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSTimeZone"] }
objc2-user-notifications = { workspace = true, features = [
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSettings",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[lints]
workspace = true
