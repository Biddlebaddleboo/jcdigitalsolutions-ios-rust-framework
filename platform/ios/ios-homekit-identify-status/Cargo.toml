[package]
name = "ios-homekit-identify-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-supplied HomeKit accessory identify-support snapshot for iOS"

[target.'cfg(all(target_os = "ios", not(target_abi = "macabi")))'.dependencies]
objc2 = { workspace = true, features = ["std"] }
objc2-home-kit = { version = "=0.3.2", default-features = false, features = ["HMAccessory"] }

[[example]]
name = "homekit_identify_link_probe"
path = "examples/homekit_identify_link_probe.rs"

[lints]
workspace = true
