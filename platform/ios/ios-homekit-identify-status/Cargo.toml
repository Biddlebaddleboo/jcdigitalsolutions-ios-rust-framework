[package]
name = "ios-homekit-identify-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-supplied HomeKit accessory identify support and operation for iOS"

[target.'cfg(all(target_os = "ios", not(target_abi = "macabi")))'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }
objc2-home-kit = { version = "=0.3.2", default-features = false, features = ["HMAccessory", "block2"] }

[[example]]
name = "homekit_identify_link_probe"
path = "examples/homekit_identify_link_probe.rs"

[lints]
workspace = true
