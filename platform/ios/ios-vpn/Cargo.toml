[package]
name = "ios-vpn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only caller-app Personal VPN status query for iOS"

[dependencies]
framework-vpn = { path = "../../../crates/framework-vpn", version = "0.1.0" }
ios-runtime = { path = "../ios-runtime", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["NSError", "NSString"] }
objc2-network-extension = { version = "=0.3.2", default-features = false, features = ["block2"] }

[lints]
workspace = true
