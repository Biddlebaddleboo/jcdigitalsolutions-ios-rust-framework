[package]
name = "ios-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "iOS sandbox file backend for framework-files"

[dependencies]
framework-core = { workspace = true }
framework-files = { path = "../../../crates/framework-files", version = "0.1.0" }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, features = ["alloc"] }
libc = { workspace = true }
ios-runtime = { path = "../ios-runtime" }
objc2 = { workspace = true, features = ["std"] }
objc2-foundation = { workspace = true, features = ["std", "NSData", "NSError", "NSFileCoordinator", "NSFileManager", "NSPathUtilities", "NSProcessInfo", "NSString", "NSURL", "NSValue", "block2"] }

[lints]
workspace = true
