[workspace]
members = ["crates/*", "platform/ios/*", "examples/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Biddlebaddleboo/jcdigitalsolutions-ios-rust-framework"

[workspace.dependencies]
framework-core = { path = "crates/framework-core", version = "0.1.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"

[profile.bench]
inherits = "release"
