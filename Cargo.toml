[workspace]
members = ["crates/*", "platform/ios/*", "platform/ios/callkit/ios-call-observer", "interop/*", "examples/*", "tools/*", "bindings/*"]
# The C++ header checks share this path glob but are not a Cargo package.
exclude = ["examples/c-minimal", "bindings/cpp", "platform/ios/callkit", "tools/validation", "tools/native-build", "tools/releases", "tools/native-build-support", "tools/ios-rust-validate"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Biddlebaddleboo/jcdigitalsolutions-ios-rust-framework"

[workspace.dependencies]
framework-core = { path = "crates/framework-core", version = "0.1.0" }
block2 = { version = "0.6.2", default-features = false }
dispatch2 = { version = "0.3.1", default-features = false }
iri-string = { version = "0.7.14", default-features = false }
libc = { version = "0.2.189", default-features = false }
objc2 = { version = "0.6.5", default-features = false }
objc2-pass-kit = { version = "=0.3.2", default-features = false }
objc2-background-tasks = { version = "0.3.2", default-features = false }
objc2-background-assets = { version = "=0.3.2", default-features = false }
objc2-av-foundation = { version = "=0.3.2", default-features = false }
objc2-avf-audio = { version = "=0.3.2", default-features = false }
objc2-app-tracking-transparency = { version = "=0.3.2", default-features = false }
objc2-ar-kit = { version = "=0.3.2", default-features = false }
objc2-device-check = { version = "=0.3.2", default-features = false }
objc2-external-accessory = { version = "=0.3.2", default-features = false }
objc2-game-kit = { version = "=0.3.2", default-features = false }
objc2-message-ui = { version = "=0.3.2", default-features = false }
objc2-natural-language = { version = "=0.3.2", default-features = false }
objc2-replay-kit = { version = "=0.3.2", default-features = false }
objc2-sound-analysis = { version = "=0.3.2", default-features = false }
objc2-shared-with-you = { version = "=0.3.2", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-graphics = { version = "0.3.2", default-features = false }
objc2-core-bluetooth = { version = "=0.3.2", default-features = false }
objc2-core-location = { version = "0.3.2", default-features = false }
objc2-cloud-kit = { version = "=0.3.2", default-features = false }
objc2-core-ml = { version = "=0.3.2", default-features = false }
objc2-core-nfc = { version = "=0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-contacts = { version = "=0.3.2", default-features = false }
objc2-event-kit = { version = "=0.3.2", default-features = false }
objc2-core-motion = { version = "0.3.2", default-features = false }
objc2-nearby-interaction = { version = "=0.3.2", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false }
objc2-metal-performance-shaders = { version = "=0.3.2", default-features = false }
objc2-model-io = { version = "=0.3.2", default-features = false }
objc2-watch-connectivity = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-health-kit = { version = "=0.3.2", default-features = false }
objc2-security = { version = "0.3.2", default-features = false }
objc2-safety-kit = { version = "=0.3.2", default-features = false }
objc2-speech = { version = "=0.3.2", default-features = false }
objc2-store-kit = { version = "=0.3.2", default-features = false }
objc2-ui-kit = { version = "0.3.2", default-features = false }
objc2-user-notifications = { version = "0.3.2", default-features = false }
objc2-video-toolbox = { version = "=0.3.2", default-features = false }
objc2-vision = { version = "=0.3.2", default-features = false }
objc2-web-kit = { version = "=0.3.2", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"

[profile.bench]
inherits = "release"
